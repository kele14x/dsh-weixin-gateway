# Bundle patch for dsh-weixin-gateway.
#
# Installing the package adds this file to the profile's bundle layers. The row
# below mounts the channel inside the Host process; it opens no socket and
# needs only the Session Controller service.
#
# `stateDir` lives under the DSH home. `defaultCwd` is optional: when the
# expression yields an empty string the plugin uses its own `workspace/`
# directory, so WeChat sessions keep their files beside the plugin instead of in
# whatever directory the Host happened to start from.

- insert:
    - id: weixin-channel
      name: dsh-weixin-gateway
      config:
        stateDir: !!js dshHomePath('integrations/dsh-weixin')
        defaultCwd: !!js process.env.DSH_WEIXIN_CWD ?? ''
        maxMessageChars: 1800
