# Single-replica DSH + WeChat gateway.
#
# One bot token admits exactly one poller, so never scale this service.
# The WeChat transport needs no inbound port; the Web UI below is optional and
# published to loopback only.

services:
  dsh:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dsh-weixin-gateway:local
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DSH_HOME: /data/dsh
      DSH_WEIXIN_CWD: /workspace
      DSH_PERMISSION_MODE: workspace-write
      DSH_WEIXIN_BIND_CODE: ${DSH_WEIXIN_BIND_CODE:?set a pairing code}
      TZ: Asia/Shanghai
      # NODE_USE_ENV_PROXY: "1"   # only when an outbound proxy is required
    volumes:
      - dsh-home:/data/dsh
      - ../workspace:/workspace
    working_dir: /workspace
    command:
      - dsh
      - web
      - --no-open
      # DSH refuses wildcard binds. This address is pinned by the network
      # definition below so the published loopback port can reach it.
      - --host
      - 172.28.0.2
      - --port
      - "3080"
      - --trusted-host
      - 127.0.0.1:3080
      - --public-url
      - http://127.0.0.1:3080
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      default:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Must exceed the gateway shutdown deadline (poll abort + notifystop + flush).
    stop_grace_period: 45s

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  dsh-home:
