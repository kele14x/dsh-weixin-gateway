# Optional reference for running the entire DSH Web Host with this plugin.
services:
  dsh:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    image: dsh-weixin-gateway-example:local
    init: true
    restart: unless-stopped
    user: "${HOST_UID:?export HOST_UID from id -u}:${HOST_GID:?export HOST_GID from id -g}"
    environment:
      HOME: /tmp
      DSH_HOME: /data/dsh
      DSH_WEIXIN_CWD: /workspace
      DSH_PERMISSION_MODE: workspace-write
      DSH_WEIXIN_BIND_CODE: ${DSH_WEIXIN_BIND_CODE:?export a fresh pairing code}
      TZ: Asia/Shanghai
    volumes:
      - ./.state/dsh-home:/data/dsh
      - ./.state/workspace:/workspace
    working_dir: /workspace
    command:
      - dsh
      - web
      - --no-open
      - --host
      - 172.28.0.2
      - --port
      - "3080"
      - --trusted-host
      - 127.0.0.1:3080
      - --public-url
      - http://127.0.0.1:3080
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      default:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "node", "/app/examples/docker/healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
